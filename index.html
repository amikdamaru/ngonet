<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>NGONET – Classic Tile Matching Game</title>
  <meta name="description" content="NGONET: permainan Onet Classic bertema perabotan dan perlengkapan rumah tangga. Bisa dimainkan offline.">
  <meta name="theme-color" content="#F5F0E6">
  <meta name="color-scheme" content="light">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="NGONET">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <!-- Layar memuat aset -->
  <div class="loader" id="loader">
    <div class="logo" aria-label="NGONET">
      <span>N</span><span>G</span><span class="logo-o">O</span><span>N</span><span>E</span><span>T</span>
    </div>
    <p class="subtitle">Classic Tile Matching Game</p>
    <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="48" aria-valuenow="0" id="loadProgress">
      <i id="loadBar"></i>
    </div>
    <p class="loader-text" id="loadText">Memuat aset…</p>
    <button class="btn btn-primary" id="retryBtn" hidden>Coba lagi</button>
  </div>

  <main class="app" id="app" hidden>
    <header class="brand">
      <button class="icon-btn" id="musicBtn" type="button" aria-pressed="true" aria-label="Musik latar" title="Musik latar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/><path class="off-slash" d="M3 3l18 18"/></svg>
      </button>
      <div class="brand-title">
        <h1 class="logo logo-sm" aria-label="NGONET">
          <span>N</span><span>G</span><span class="logo-o">O</span><span>N</span><span>E</span><span>T</span>
        </h1>
        <p class="subtitle">Classic Tile Matching Game</p>
      </div>
      <button class="icon-btn" id="sfxBtn" type="button" aria-pressed="true" aria-label="Efek suara" title="Efek suara">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path class="on-wave" d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/><path class="off-slash" d="M3 3l18 18"/></svg>
      </button>
    </header>

    <div class="play">
    <section class="stats" aria-label="Informasi skor">
      <div class="stat stat-score">
        <span class="stat-label">Score</span>
        <span class="stat-value" id="score">0</span>
        <span class="score-pop" id="scorePop" aria-hidden="true"></span>
      </div>
      <div class="stat">
        <span class="stat-label">Pairs left</span>
        <span class="stat-value" id="pairs">32</span>
      </div>
      <div class="stat stat-wins" title="Jumlah kemenangan">
        <span class="stat-label">Wins</span>
        <span class="stat-value"><svg class="crown" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7.5l4.6 4.2L12 4.5l4.4 7.2L21 7.5l-1.9 11H4.9z"/><rect x="5" y="19.5" width="14" height="2" rx="1"/></svg><span id="wins">0</span></span>
      </div>
    </section>

    <div class="combo" id="combo" aria-live="polite">
      <span class="combo-text" id="comboText"></span>
      <span class="combo-bar"><i id="comboBar"></i></span>
    </div>

    <div class="board-wrap" id="boardWrap">
      <div class="board" id="board" role="grid" aria-label="Papan permainan 8 x 8"></div>
      <svg class="links" id="links" aria-hidden="true"></svg>
    </div>

    <p class="notice" id="notice" role="status"></p>
    </div>

    <div class="actions">
      <button class="btn" id="newGameBtn" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/><path d="M17 3v6M14 6h6"/></svg>
        <span>New Game <small>susunan baru</small></span>
      </button>
      <button class="btn btn-primary" id="restartBtn" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5"/></svg>
        <span>Restart <small>susunan sama</small></span>
      </button>
    </div>
  </main>

  <!-- Dialog konfirmasi (Restart / New Game saat permainan berjalan) -->
  <div class="modal" id="confirmModal" role="dialog" aria-modal="true" aria-labelledby="confirmTitle" hidden>
    <div class="modal-card">
      <h2 id="confirmTitle">Restart permainan?</h2>
      <p id="confirmText">Skor dan progres saat ini akan hilang.</p>
      <div class="modal-actions">
        <button class="btn" id="confirmNo" type="button">Batal</button>
        <button class="btn btn-primary" id="confirmYes" type="button">Restart</button>
      </div>
    </div>
  </div>

  <!-- Layar game over -->
  <div class="modal modal-over" id="overModal" role="dialog" aria-modal="true" aria-labelledby="overTitle" hidden>
    <div class="modal-card">
      <div class="logo logo-sm" aria-label="NGONET">
        <span>N</span><span>G</span><span class="logo-o">O</span><span>N</span><span>E</span><span>T</span>
      </div>
      <h2 class="over-title" id="overTitle">GAME OVER</h2>
      <p class="over-reason" id="overReason">Combo terputus</p>
      <p class="win-label">Skor</p>
      <p class="win-score" id="overScore">0</p>
      <p class="over-progress" id="overProgress"></p>
      <button class="btn btn-primary btn-wide over-retry" id="overRestartBtn" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5"/></svg>
        <span>Retry</span>
      </button>
    </div>
  </div>

  <!-- Layar kemenangan -->
  <div class="modal modal-win" id="winModal" role="dialog" aria-modal="true" aria-labelledby="winTitle" hidden>
    <div class="confetti" id="confetti" aria-hidden="true"></div>
    <div class="modal-card">
      <div class="logo logo-sm" aria-label="NGONET">
        <span>N</span><span>G</span><span class="logo-o">O</span><span>N</span><span>E</span><span>T</span>
      </div>
      <h2 class="win-title" id="winTitle" aria-label="YOU WIN!">
        <span>Y</span><span>O</span><span>U</span>&nbsp;<span>W</span><span>I</span><span>N</span><span>!</span>
      </h2>
      <p class="win-label">Skor akhir</p>
      <p class="win-score" id="winScore">0</p>
      <p class="win-count"><svg class="crown" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7.5l4.6 4.2L12 4.5l4.4 7.2L21 7.5l-1.9 11H4.9z"/><rect x="5" y="19.5" width="14" height="2" rx="1"/></svg><span id="winCount"></span></p>
      <button class="btn btn-primary btn-wide" id="winNewGameBtn" type="button">New Game</button>
    </div>
  </div>
</body>
</html>
